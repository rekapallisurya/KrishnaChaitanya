name: R Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          packages <- c(
            "tidyverse", "data.table", "mgcv", "xgboost", "gbm", "tweedie", "caret",
            "ggplot2", "plotly", "shiny", "DT", "iml", "DALEX", "SHAPforxgboost", "stringi"
          )
          missing <- packages[!packages %in% rownames(installed.packages())]
          if (length(missing) > 0) {
            install.packages(missing, repos = "https://cloud.r-project.org")
          }

      - name: Run synthetic data + modelling + evaluation
        shell: Rscript {0}
        run: |
          source("run_all.R")

      - name: Verify required output files
        shell: Rscript {0}
        run: |
          required <- c(
            "data/policies.csv",
            "data/exposures.csv",
            "data/claims.csv",
            "data/claim_development.csv",
            "results/lift_charts.csv",
            "results/calibration_results.csv",
            "results/exposure_analysis.csv",
            "results/shap_importance.csv"
          )
          missing <- required[!file.exists(required)]
          if (length(missing) > 0) {
            stop(paste("Missing output files:", paste(missing, collapse = ", ")))
          }
          cat("All required outputs are present.\n")

      - name: Upload data and results artifacts
        uses: actions/upload-artifact@v4
        with:
          name: insurance-pricing-artifacts
          path: |
            data/*.csv
            results/*.csv
          if-no-files-found: error
